<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Store BD — AI Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
        .prose pre { background: #020617; padding: 0.85rem; border-radius: 0.75rem; border: 1px solid #1e293b; overflow-x: auto; }
        .prose code { color: #38bdf8; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Header -->
    <header class="border-b border-slate-800/80 glass sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-cyan-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-purple-500/30">
                    👻
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-purple-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">Ghost Store BD</h1>
                    <p class="text-[11px] text-slate-400 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> AI Companion
                    </p>
                </div>
            </div>
            <a href="https://ghoststorebd.netlify.app" class="text-xs bg-slate-900 hover:bg-slate-800 text-cyan-400 border border-cyan-500/30 px-3.5 py-2 rounded-xl transition flex items-center gap-2 font-semibold shadow-lg shadow-cyan-500/10">
                <i class="fa-solid fa-lock text-xs"></i> Top Up site
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col z-10">

        <!-- DASHBOARD GRID VIEW -->
        <div id="dashboard-view" class="space-y-6 my-auto py-6">
            <div class="text-center space-y-2 max-w-xl mx-auto">
                <span class="bg-purple-500/10 text-cyan-300 border border-cyan-500/20 text-xs px-3.5 py-1 rounded-full font-semibold">
                    <i class="fa-solid fa-sparkles"></i> AI Ecosystem V9.0
                </span>
                <h2 class="text-2xl md:text-3xl font-bold text-white">আপনার প্রয়োজনীয় AI অ্যাসিস্ট্যান্ট বেছে নিন</h2>
                <p class="text-sm text-slate-400">টপআপ সাপোর্ট, গেম সেটিং, স্টাইলিশ নাম কিংবা বাজেট অফার—সব মিলবে এক জায়গায়!</p>
            </div>

            <!-- Dynamic Cards Container -->
            <div id="botCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pt-4">
                <div class="col-span-full text-center py-12 text-slate-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-purple-500 mb-2"></i>
                    <p class="text-xs">AI অ্যাসিস্ট্যান্ট লোড হচ্ছে...</p>
                </div>
            </div>
        </div>

        <!-- CHAT INTERFACE -->
        <div id="chat-view" class="hidden flex-1 flex flex-col bg-slate-900/90 border border-slate-800/80 rounded-3xl overflow-hidden my-auto h-[620px] shadow-2xl backdrop-blur-xl">
            
            <!-- Chat Header & Mode Switcher -->
            <div class="bg-slate-950/80 p-4 border-b border-slate-800 flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-3">
                    <button onclick="closeChat()" class="text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-800 px-3 py-2 rounded-xl transition text-xs font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-left"></i> ব্যাক
                    </button>
                    <div id="bot-icon-wrapper" class="w-10 h-10 rounded-xl flex items-center justify-center text-lg bg-purple-500/10 text-purple-400 border border-purple-500/30">
                        <i id="active-bot-icon" class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h3 id="bot-title" class="font-bold text-white text-sm">AI Assistant</h3>
                        <p id="bot-model-tag" class="text-[10px] text-cyan-400 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                            <span id="modelName">S.P.A.R.K AI Engine</span>
                        </p>
                    </div>
                </div>

                <!-- AI vs Live Admin Mode Switch -->
                <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl text-xs">
                    <button onclick="setChatMode('ai')" id="btnModeAi" class="px-3 py-1.5 rounded-lg bg-purple-600 text-white font-bold transition">
                        🤖 AI বট
                    </button>
                    <button onclick="setChatMode('admin')" id="btnModeAdmin" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white font-bold transition">
                        👤 লাইভ এডমিন
                    </button>
                </div>
            </div>

            <!-- Chat Messages Area -->
            <div id="chat-messages" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-4 text-sm">
                <!-- Messages populate dynamically -->
            </div>

            <!-- Input Area -->
            <div class="p-3 md:p-4 bg-slate-950/90 border-t border-slate-800">
                <form id="chat-form" onsubmit="handleSend(event)" class="flex gap-2">
                    <input type="text" id="user-input" placeholder="আপনার প্রশ্ন বা বার্তাটি লিখুন..." autocomplete="off" class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 transition text-sm">
                    <button type="submit" id="sendBtn" class="bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white px-6 py-3 rounded-2xl font-semibold transition flex items-center gap-2 text-sm shadow-lg shadow-purple-600/20">
                        <span>পাঠান</span>
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC6Ww5ePRGYdh55-qr-fOkS4VcuXoBM7oQ",
            authDomain: "panda-47867.firebaseapp.com",
            projectId: "panda-47867",
            storageBucket: "panda-47867.firebasestorage.app",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentBotId = '';
        let botConfigs = {};
        let chatHistory = [];
        let chatMode = 'ai'; // 'ai' or 'admin'
        let userSessionId = localStorage.getItem('user_chat_session') || ('usr_' + Date.now().toString().slice(-6));
        localStorage.setItem('user_chat_session', userSessionId);

        if ('speechSynthesis' in window && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                try { window.speechSynthesis.getVoices(); } catch(e){}
            };
        }

        window.onload = () => {
            listenToBotsRealtime();
        };

        function listenToBotsRealtime() {
            db.collection('bot_configs').onSnapshot(snapshot => {
                const grid = document.getElementById('botCardsGrid');
                grid.innerHTML = '';
                botConfigs = {};

                if(snapshot.empty) {
                    grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-8">কোনো AI বট তৈরি করা নেই! এডমিন প্যানেল থেকে বট তৈরি করুন।</div>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    botConfigs[id] = data;

                    const card = document.createElement('div');
                    card.onclick = () => openChat(id);
                    card.className = "group cursor-pointer bg-slate-900/90 border border-slate-800/80 hover:border-purple-500/50 p-6 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-purple-500/10 flex flex-col justify-between backdrop-blur-xl relative overflow-hidden";
                    card.innerHTML = `
                        <div class="space-y-3">
                            <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/30 text-purple-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                                <i class="${data.icon || 'fa-solid fa-robot'}"></i>
                            </div>
                            <h3 class="font-bold text-lg text-white group-hover:text-purple-400 transition">${data.name || id}</h3>
                            <p class="text-xs text-slate-400 leading-relaxed line-clamp-2">${data.desc || 'সহায়তার জন্য প্রস্তুত AI।'}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs font-semibold text-purple-400">
                            <span>চ্যাট শুরু করুন</span>
                            <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function openChat(botId) {
            currentBotId = botId;
            chatHistory = [];
            stopSpeech();

            const bot = botConfigs[botId];

            document.getElementById('bot-title').innerText = bot.name || 'AI Assistant';
            document.getElementById('modelName').innerText = 'S.P.A.R.K AI Engine';
            
            const activeIcon = document.getElementById('active-bot-icon');
            activeIcon.className = bot.icon || 'fa-solid fa-robot';

            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');

            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center text-sm bg-purple-500/10 text-purple-400 border border-purple-500/30">
                        <i class="${bot.icon || 'fa-solid fa-robot'}"></i>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/50 p-3.5 rounded-2xl rounded-tl-none max-w-[85%] text-slate-200 shadow-sm">
                        ${bot.welcome || 'হ্যালো! কীভাবে সাহায্য করতে পারি?'}
                    </div>
                </div>
            `;

            setChatMode('ai');
        }

        function setChatMode(mode) {
            chatMode = mode;
            const btnAi = document.getElementById('btnModeAi');
            const btnAdmin = document.getElementById('btnModeAdmin');

            if (mode === 'ai') {
                btnAi.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white font-bold transition";
                btnAdmin.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white font-bold transition";
            } else {
                btnAdmin.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white font-bold transition";
                btnAi.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white font-bold transition";
                listenToLiveAdminReplies();
            }
        }

        function listenToLiveAdminReplies() {
            db.collection('live_chats').doc(userSessionId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
                if (chatMode !== 'admin') return;

                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = `
                    <div class="bg-purple-900/40 border border-purple-500/30 p-2.5 rounded-xl text-xs text-purple-200 text-center mb-4">
                        <i class="fa-solid fa-user-shield"></i> আপনি এখন সরাসরি লাইভ এডমিনের সাথে চ্যাট করছেন।
                    </div>
                `;

                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isUser = msg.sender !== 'admin';

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;
                    msgDiv.innerHTML = `
                        ${!isUser ? `<div class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center text-sm bg-purple-600 text-white"><i class="fa-solid fa-user-shield"></i></div>` : ''}
                        <div class="p-3.5 rounded-2xl max-w-[85%] ${isUser ? 'bg-gradient-to-r from-purple-600 to-cyan-600 text-white rounded-tr-none' : 'bg-slate-800/80 border border-slate-700/50 text-slate-200 rounded-tl-none'}">
                            ${escapeHtml(msg.text)}
                        </div>
                    `;
                    chatMessages.appendChild(msgDiv);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function closeChat() {
            stopSpeech();
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
        }

        function clearChat() {
            stopSpeech();
            if(currentBotId) openChat(currentBotId);
        }

        async function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const userMsg = input.value.trim();
            if(!userMsg) return;

            input.value = '';

            // 🔴 LIVE ADMIN MODE
            if (chatMode === 'admin') {
                try {
                    await db.collection('live_chats').doc(userSessionId).collection('messages').add({
                        sender: 'user',
                        text: userMsg,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    await db.collection('live_chats').doc(userSessionId).set({
                        lastMsg: userMsg,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                } catch(err) {
                    alert("লাইভ মেসেজ পাঠাতে সমস্যা: " + err.message);
                }
                return;
            }

            // 🤖 AI BOT MODE
            const bot = botConfigs[currentBotId];
            if(!bot || !bot.apiKey) {
                alert("এই বটের জন্য কোনো API Key দেওয়া নেই! Admin Panel থেকে API Key আপডেট করুন।");
                return;
            }

            const chatMessages = document.getElementById('chat-messages');

            chatMessages.innerHTML += `
                <div class="flex gap-3 justify-end">
                    <div class="bg-gradient-to-r from-purple-600 to-cyan-600 text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-md">
                        ${escapeHtml(userMsg)}
                    </div>
                </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const loadingId = 'load-' + Date.now();
            chatMessages.innerHTML += `
                <div id="${loadingId}" class="flex gap-3">
                    <div class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center text-sm bg-purple-500/10 text-purple-400 border border-purple-500/30">
                        <i class="${bot.icon || 'fa-solid fa-robot'}"></i>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/50 p-3.5 rounded-2xl rounded-tl-none text-slate-400 text-xs flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch fa-spin text-cyan-400"></i> উত্তর তৈরি হচ্ছে...
                    </div>
                </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Keep only last 4 messages for fast API execution
                const trimmedHistory = chatHistory.length > 4 ? chatHistory.slice(-4) : chatHistory;
                trimmedHistory.push({ role: 'user', parts: [{ text: userMsg }] });

                const reply = await getGeminiResponse(bot, trimmedHistory);
                document.getElementById(loadingId).remove();

                chatHistory.push({ role: 'user', parts: [{ text: userMsg }] });
                chatHistory.push({ role: 'model', parts: [{ text: reply }] });

                const parsedMarkdown = marked.parse(reply);
                const msgId = 'msg-' + Date.now();

                chatMessages.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center text-sm bg-purple-500/10 text-purple-400 border border-purple-500/30">
                            <i class="${bot.icon || 'fa-solid fa-robot'}"></i>
                        </div>
                        <div class="bg-slate-800/80 border border-slate-700/50 p-4 rounded-2xl rounded-tl-none max-w-[85%] text-slate-200 prose prose-invert relative group">
                            <div id="${msgId}">${parsedMarkdown}</div>
                            <div class="mt-2 pt-2 border-t border-slate-700/50 flex gap-3 text-xs text-slate-400">
                                <button onclick="copyMsg('${msgId}')" class="hover:text-cyan-400 transition flex items-center gap-1">
                                    <i class="fa-solid fa-copy"></i> কপি
                                </button>
                                <button onclick="toggleSpeech('${msgId}', this)" class="hover:text-cyan-400 transition flex items-center gap-1 voice-btn">
                                    <i class="fa-solid fa-volume-high"></i> <span>ভয়েস শুনুন</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } catch(error) {
                document.getElementById(loadingId).remove();
                chatMessages.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center text-sm bg-red-500/10 text-red-400 border border-red-500/30">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="bg-red-950/40 border border-red-800/50 p-3 rounded-2xl rounded-tl-none text-red-300 text-xs">
                            এরর: ${error.message}
                        </div>
                    </div>
                `;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function getGeminiResponse(bot, historyPayload) {
            // Use Gemini 2.5 Flash / 1.5 Flash for ultra-fast response
            const targetModel = bot.model || 'gemini-2.5-flash';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${bot.apiKey}`;

            const payload = {
                system_instruction: bot.prompt ? {
                    parts: [{ text: bot.prompt }]
                } : undefined,
                contents: historyPayload,
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 2048 // 🎯 টোকেন বাড়িয়ে দেওয়া হয়েছে যেন মেসেজ কোনোভাবেই কাটা না পড়ে
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "API রেসপন্স পাওয়া যায়নি। API Key বা Model যাচাই করুন।");
            }

            return data.candidates[0].content.parts[0].text;
        }

        function copyMsg(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            alert("লেখা কপি করা হয়েছে!");
        }

        let activeAudioButton = null;
        let activeMsgId = null;

        function toggleSpeech(elementId, btnElement) {
            if (!('speechSynthesis' in window)) {
                alert("আপনার ব্রাউজারে টেক্সট-টু-স্পিচ সমর্থিত নয়।");
                return;
            }

            if (activeMsgId === elementId && window.speechSynthesis.speaking) {
                stopSpeech();
                return;
            }

            stopSpeech();

            const rawText = document.getElementById(elementId).innerText;
            const cleanText = rawText.replace(/[*#_`]/g, '').trim();

            if(!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'bn-BD';

            const bot = botConfigs[currentBotId] || {};
            const gender = bot.voiceGender || 'female';

            const voices = window.speechSynthesis.getVoices();
            let selectedVoice = voices.find(v => v.lang.includes('bn') && v.name.toLowerCase().includes(gender));
            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.includes('bn'));
            }
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            if (gender === 'male') {
                utterance.pitch = 0.75;
                utterance.rate = 0.95;
            } else {
                utterance.pitch = 1.25;
                utterance.rate = 1.0;
            }

            activeAudioButton = btnElement;
            activeMsgId = elementId;
            btnElement.innerHTML = `<i class="fa-solid fa-circle-stop text-red-400"></i> <span class="text-red-400 font-bold">থামান</span>`;

            utterance.onend = () => resetAudioButton();
            utterance.onerror = () => resetAudioButton();

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeech() {
            if ('speechSynthesis' in window && window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            resetAudioButton();
        }

        function resetAudioButton() {
            if (activeAudioButton) {
                activeAudioButton.innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>ভয়েস শুনুন</span>`;
            }
            activeAudioButton = null;
            activeMsgId = null;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
